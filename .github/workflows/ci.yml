name: CI

on:
  push:
  pull_request:

env:
  ELIXIR_VERSION: "1.20.2-otp-29"
  OTP_VERSION: "29.0.3"
  FWUP_VERSION: "1.15.0"

jobs:
  compile:
    name: Compile · Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-compile-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-compile-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install fwup
        run: |
          curl -fsSL "https://github.com/fwup-home/fwup/releases/download/v${FWUP_VERSION}/fwup_${FWUP_VERSION}_amd64.deb" -o /tmp/fwup.deb
          sudo dpkg -i /tmp/fwup.deb || sudo apt-get install -f -y

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      # The :hardware-tagged fwup integration test spawns the real fwup
      # binary and streams a trivially small .fw; on fast runners fwup
      # consumes and exits before the terminator write lands, breaking the
      # pipe (:epipe). It's excluded here (as it was in the source app) and
      # exercised on real hardware instead. See ROBUSTNESS note re: :epipe.
      - name: Run tests
        run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # PLTs are cached separately from deps/_build: they're expensive to
      # rebuild (whole-OTP + whole-deps type analysis) but only need to be
      # invalidated when dependencies change, same key as the deps cache.
      - name: Cache deps, _build, and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-dialyzer-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run dialyzer
        run: mix dialyzer

  credo:
    name: Credo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-credo-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-credo-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run credo
        run: mix credo --strict

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-sobelow-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-sobelow-

      - name: Fetch dependencies
        run: mix deps.get

      # Not a Phoenix app: sobelow skips the router checks and scans the
      # rest (file/traversal, crypto, config, etc.).
      - name: Run sobelow
        run: mix sobelow --private --skip --exit --threshold medium

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check for unused deps in mix.lock
        run: mix deps.unlock --check-unused

      # Fails on retired packages and on EEF/GHSA security advisories.
      - name: Audit dependencies
        run: mix hex.audit

  argus:
    name: Argus
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-24.04-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-argus-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-24.04-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-argus-

      - name: Fetch dependencies
        run: mix deps.get

      # Compile first so build output never mixes into the JSON report.
      - name: Compile
        run: mix compile

      # No file-level ignores: every finding must be fixed or carry a
      # reviewed entry in .argus-baseline.exs (see scripts/argus_baseline.exs).
      - name: Run argus
        run: mix argus --format json > argus.json

      - name: Self-test argus baseline script
        run: elixir scripts/argus_baseline.exs --self-test

      - name: Check argus findings against baseline
        run: elixir scripts/argus_baseline.exs argus.json .argus-baseline.exs
